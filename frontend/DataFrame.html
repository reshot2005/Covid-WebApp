<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>COVID-19 Dataframe View</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Top Navigation -->
  <div class="top-nav">
    <a href="index.html">HOME</a>
    <a href="#">ABOUT</a>
    <a href="#">FAQ</a>
  </div>

  <div class="tracker-container">
    <h1>COVID-19 Dataframe</h1>
    <p class="subtext">View tabular data in a scrollable format</p>

    <div class="table-container">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Confirmed</th>
            <th>Recovered</th>
            <th>Deaths</th>
          </tr>
        </thead>
        <tbody>
          <!-- Table rows will be filled by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
