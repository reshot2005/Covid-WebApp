<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: #131528;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .contact-card {
      background-color: #1c1f35;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      text-align: center;
    }

    .contact-card h1 {
      font-size: 2.4rem;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .contact-card p {
      font-size: 1.1rem;
      margin-bottom: 25px;
      color: #dcdcdc;
    }

    .email-btn {
      display: inline-block;
      padding: 12px 20px;
      background-color: #2b2e4a;
      border-radius: 12px;
      font-weight: 600;
      color: #ff5252;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      transition: background 0.3s;
    }

    .email-btn:hover {
      background-color: #383c5a;
    }

    .signature {
      margin-top: 30px;
      font-style: italic;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
<body>
    <div class="top-nav">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="faqs.html">FAQs</a>
    </div>
      
  <div class="contact-card">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you. Whether you have a question about features, pricing, or anything else — feel free to reach out.</p>
    <a href="mailto:suryaphishing@gmail.com" class="email-btn">suryaphishing@gmail.com</a>
    <div class="signature">— Surya</div>
  </div>

</body>
</html>
